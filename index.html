<style>
:root{
  --kem:#FDF8EE; --giay:#fff; --muc:#5F4B41; --muc2:#8B7568; --muc3:#B3A196; --vien:#F0E4D4;
  --sua:#5AA9D6; --suaN:#EAF5FC; --suaV:#A8D8EF;
  --an:#E87BA5;  --anN:#FDEEF4;  --anV:#F6BAD1;
  --ta:#E09A3E;  --taN:#FDF2E0;  --taV:#F3CE96;
  --thuoc:#9585D8; --thuocN:#F1EEFB; --thuocV:#C6BCEC;
  --can:#4FAFB4; --canN:#E5F5F5; --canV:#A6DBDD;
  --la:#84B44F;  --laN:#F0F7E5;  --laV:#C0DC9A;
  --vang:#F5C542; --dem:#5B5480; --do:#E0705C; --doN:#FDEDEA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--kem); color:var(--muc);
  font-family:'Baloo 2',Quicksand,Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;
  font-weight:600; -webkit-font-smoothing:antialiased;
  padding:0 0 env(safe-area-inset-bottom);
}
#app{max-width:520px;margin:0 auto;padding:8px 14px 40px}
button{font-family:inherit;font-weight:700;border:0;background:none;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-weight:600;font-size:16px;width:100%;
  background:#fff;color:var(--muc);border:1.8px solid var(--vien);border-radius:16px;padding:12px 14px}
input:focus,textarea:focus{outline:none;border-color:var(--sua)}
textarea{resize:vertical}
.card{border-radius:24px;padding:12px 14px 14px;margin-top:14px;border:2px solid var(--vien);background:#fff;position:relative}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hd .ic{width:40px;height:40px;flex:0 0 auto;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.hd .pill{border-radius:999px;padding:6px 14px;color:#fff;font-size:12px;letter-spacing:.05em;font-weight:700}
.hd .rt{margin-left:auto}
.inner{background:#fff;border-radius:18px;padding:6px 8px 8px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 12px;margin-bottom:8px;border:1.8px solid var(--vien)}
.row .t{width:44px;flex:0 0 auto;font-size:14px;font-weight:700}
.row .cir{width:36px;height:36px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center}
.row{align-items:flex-start}
.row .t{padding-top:2px}
.row .bd{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;overflow:hidden;font-weight:600;padding:0}
.row .b1{display:block;font-size:14px;font-weight:700;line-height:1.35;word-break:break-word}
.row .b2{display:block;font-size:12px;color:var(--muc3);line-height:1.45;word-break:break-word}
.row .x{flex:0 0 auto;color:var(--muc3);padding:4px 6px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.big{border-radius:999px;padding:13px 8px;font-size:14px;background:#fff;border:2px solid;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.stat{background:#fff;border:1.8px solid var(--vien);border-radius:18px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muc3);line-height:1.2}
.chip{border-radius:999px;padding:9px 13px;font-size:14px;background:#fff;border:1.8px solid var(--vien);color:var(--muc2);margin:0 6px 6px 0}
.chip.on{color:#fff}
.chips{display:flex;flex-wrap:wrap;margin-bottom:10px}
.lb{display:block;font-size:12px;color:var(--muc2);margin:0 0 6px 2px;font-weight:700}
.note{font-size:12px;font-weight:500;line-height:1.6;color:var(--muc3)}
.warn{background:var(--doN);color:var(--do);border-radius:16px;padding:10px 14px;font-size:12px;line-height:1.6;margin-bottom:10px}
.tip{background:var(--thuocN);color:var(--muc2);border-radius:16px;padding:10px 14px;font-size:12px;line-height:1.6;margin-bottom:14px}
.datebar{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid var(--vien);border-radius:999px;padding:5px 6px;margin-top:4px}
.datebar b{font-size:14px}
.datebar button{padding:4px 14px;font-size:20px;color:var(--muc2)}
.mini{border-radius:999px;padding:7px 14px;font-size:12px;background:#fff;border:2px solid var(--vien);color:var(--muc2)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:11.5px;color:var(--muc3);padding:4px 0 8px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:5px;height:118px}
.bars>button{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}
.bars .v{font-size:11px;color:var(--muc3)}
.bars .bar{width:100%;border-radius:10px 10px 0 0}
.bars .dots{height:8px;display:flex;gap:2px;align-items:center}
.bars .dots i{width:5px;height:5px;border-radius:50%;background:var(--an)}
.bars .d{font-size:11px;color:var(--muc3)}
.tick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:5px 0}
.tick .box{width:25px;height:25px;flex:0 0 auto;border-radius:8px;border:2px solid var(--vien);background:#fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.tick.on .box{background:var(--thuoc);border-color:var(--thuoc)}
.tick span{font-size:14px;color:var(--muc2)}
.tick.on span{color:var(--muc)}
.kv{display:flex;justify-content:space-between;gap:14px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--vien)}
.kv em{font-style:normal;color:var(--muc3)}
.wlist{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:6px 0;font-weight:600}
.wlist em{font-style:normal;color:var(--muc3)}
#modal{position:fixed;inset:0;z-index:50;background:rgba(95,75,65,.42);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{width:100%;max-width:520px;background:var(--kem);border-radius:26px 26px 0 0;padding:14px 18px calc(26px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
.grip{width:48px;height:6px;border-radius:99px;background:var(--vien);margin:0 auto 14px}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sh .pill{border-radius:999px;padding:7px 16px;color:#fff;font-size:14px;font-weight:700}
.acts{display:flex;gap:12px;margin-top:22px}
.acts button{flex:1;border-radius:999px;padding:13px;font-size:14px}
.acts .no{background:#fff;border:2px solid var(--vien);color:var(--muc2)}
.acts .ok{color:#fff}
.hide{display:none !important}
.foot{text-align:center;color:var(--muc3);font-size:12px;padding-top:22px;line-height:1.8}
</style>
</head>

<script>
/* ============ dữ liệu ============ */
var KEY='nhatkybe_v1';
var S={be:{ten:'',dob:'',gt:'trai'},logs:{},cans:[],tt:{},tp:{}};
var ngay=dk(new Date()), F={};

function taiDL(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);
  S.be=d.be||S.be;S.logs=d.logs||{};S.cans=d.cans||[];S.tt=d.tt||{};S.tp=d.tp||{};}}catch(e){}}
function luu(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){alert('Không lưu được. Máy có thể đang ở chế độ duyệt web riêng tư.');}}

/* ============ ngày giờ ============ */
function p2(n){return (n<10?'0':'')+n}
function dk(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function pk(k){var a=k.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function addD(k,n){var d=pk(k);d.setDate(d.getDate()+n);return dk(d)}
function hhmm(){var d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())}
function tmin(t){var a=t.split(':');return +a[0]*60+ +a[1]}
function bgio(){var d=new Date();return d.getHours()*60+d.getMinutes()}
var WD=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
function nhanNgay(k){var t=dk(new Date());if(k===t)return 'Hôm nay';if(k===addD(t,-1))return 'Hôm qua';
  var d=pk(k);return WD[d.getDay()]+', '+d.getDate()+'/'+(d.getMonth()+1)}
function khoang(p){var g=Math.floor(p/60),m=p%60;return g>0?(g+' giờ '+m+' phút'):(m+' phút')}
function tuoiTai(dob,moc){
  if(!dob)return null;
  var b=pk(dob),n=moc?(typeof moc==='string'?pk(moc):moc):new Date();
  var th=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth());
  var ng=n.getDate()-b.getDate();
  if(ng<0){th--;ng+=new Date(n.getFullYear(),n.getMonth(),0).getDate();}
  if(th<0)return{thang:0,ngay:0,le:0,chu:'mới sinh'};
  return{thang:th,ngay:ng,le:th+ng/30.4,chu:th===0?(ng+' ngày tuổi'):(th+' tháng '+ng+' ngày')};
}
function mocSua(t){if(t==null)return null;
  if(t<1)return{cu:'60–90 ml',so:'8–12 cữ',tong:'khoảng 500–700 ml',ad:'Chưa ăn dặm'};
  if(t<3)return{cu:'90–120 ml',so:'7–9 cữ',tong:'khoảng 700–900 ml',ad:'Chưa ăn dặm'};
  if(t<6)return{cu:'120–180 ml',so:'5–7 cữ',tong:'khoảng 700–950 ml',ad:'Chưa ăn dặm'};
  if(t<9)return{cu:'180–240 ml',so:'4–5 cữ',tong:'khoảng 700–900 ml',ad:'1–2 bữa, loãng rồi đặc dần'};
  if(t<12)return{cu:'180–240 ml',so:'3–4 cữ',tong:'khoảng 600–800 ml',ad:'2–3 bữa + bữa phụ'};
  return{cu:'150–200 ml',so:'2–3 cữ',tong:'khoảng 400–600 ml',ad:'3 bữa chính + 1–2 bữa phụ'};
}
var WHO={trai:{0:[2.5,4.4],1:[3.4,5.8],2:[4.3,7.1],3:[5,8],4:[5.6,8.7],5:[6,9.3],6:[6.4,9.8],7:[6.7,10.3],
  8:[6.9,10.7],9:[7.1,11],10:[7.4,11.4],11:[7.6,11.7],12:[7.7,12],15:[8.3,12.8],18:[8.8,13.7],21:[9.2,14.5],24:[9.7,15.3]},
 gai:{0:[2.4,4.2],1:[3.2,5.5],2:[3.9,6.6],3:[4.5,7.5],4:[5,8.2],5:[5.4,8.8],6:[5.7,9.3],7:[6,9.8],
  8:[6.3,10.2],9:[6.5,10.5],10:[6.7,10.9],11:[6.9,11.2],12:[7,11.5],15:[7.6,12.4],18:[8.1,13.2],21:[8.6,14],24:[9,14.8]}};
function khoangCan(x,gt){var b=WHO[gt==='gai'?'gai':'trai'];
  var ks=Object.keys(b).map(Number).sort(function(a,z){return a-z});
  x=Math.max(0,Math.min(24,x));var lo=ks[0],hi=ks[ks.length-1];
  for(var i=0;i<ks.length-1;i++){if(x>=ks[i]&&x<=ks[i+1]){lo=ks[i];hi=ks[i+1];break}}
  if(lo===hi)return b[lo];var p=(x-lo)/(hi-lo);
  return [b[lo][0]+(b[hi][0]-b[lo][0])*p, b[lo][1]+(b[hi][1]-b[lo][1])*p];
}

/* ============ biểu đồ cân ============ */
function bieuDoCan(){
  var W=320,H=170,mL=30,mR=8,mT=10,mB=22, tu=tuoiTai(S.be.dob);
  var maxT=Math.max(6,Math.ceil((tu?tu.le:6)+1));
  var diem=S.cans.slice().sort(function(a,b){return a.ngay.localeCompare(b.ngay)}).map(function(c){
    var t=tuoiTai(S.be.dob,c.ngay);return {x:t?Math.min(t.le,24):0,y:c.kg}}).sort(function(a,b){return a.x-b.x});
  var bands=[];for(var i=0;i<=24;i++){var tv=i/24*maxT;bands.push({t:tv,r:khoangCan(tv,S.be.gt)})}
  var lows=bands.map(function(b){return b.r[0]}).concat(diem.map(function(d){return d.y}));
  var his=bands.map(function(b){return b.r[1]}).concat(diem.map(function(d){return d.y}));
  var yMin=Math.max(0,Math.min.apply(null,lows)-.6), yMax=Math.max.apply(null,his)+.6;
  function px(t){return mL+t/maxT*(W-mL-mR)} function py(v){return H-mB-(v-yMin)/(yMax-yMin)*(H-mT-mB)}
  var pts=bands.map(function(b){return px(b.t).toFixed(1)+','+py(b.r[1]).toFixed(1)})
    .concat(bands.slice().reverse().map(function(b){return px(b.t).toFixed(1)+','+py(b.r[0]).toFixed(1)})).join(' ');
  var o='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">';
  o+='<polygon points="'+pts+'" fill="#E5F5F5" stroke="#A6DBDD" stroke-width="1.4"/>';
  var buoc=(yMax-yMin>8)?2:1;
  for(var v=Math.ceil(yMin);v<=yMax;v+=buoc){
    o+='<line x1="'+mL+'" y1="'+py(v).toFixed(1)+'" x2="'+(W-mR)+'" y2="'+py(v).toFixed(1)+'" stroke="#F0E4D4"/>';
    o+='<text x="'+(mL-6)+'" y="'+py(v).toFixed(1)+'" text-anchor="end" dominant-baseline="middle" font-family="inherit" font-size="9.5" font-weight="600" fill="#B3A196">'+v+'</text>'}
  var nx=Math.min(maxT,12);
  for(var i2=0;i2<=nx;i2++){var tv2=i2/nx*maxT;
    o+='<text x="'+px(tv2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-family="inherit" font-size="9.5" font-weight="600" fill="#B3A196">'+Math.round(tv2)+'</text>'}
  o+='<text x="'+(mL-6)+'" y="'+(mT+2)+'" text-anchor="end" font-family="inherit" font-size="9" font-weight="600" fill="#B3A196">kg</text>';
  o+='<text x="'+(W-mR)+'" y="'+(H-6)+'" text-anchor="end" font-family="inherit" font-size="9" font-weight="600" fill="#B3A196">tháng</text>';
  if(diem.length>1){o+='<path d="'+diem.map(function(d,i){return (i?'L':'M')+' '+px(d.x).toFixed(1)+' '+py(d.y).toFixed(1)}).join(' ')+'" fill="none" stroke="#4FAFB4" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>'}
  diem.forEach(function(d){o+='<circle cx="'+px(d.x).toFixed(1)+'" cy="'+py(d.y).toFixed(1)+'" r="5.4" fill="#fff" stroke="#4FAFB4" stroke-width="1.6"/><circle cx="'+px(d.x).toFixed(1)+'" cy="'+py(d.y).toFixed(1)+'" r="2.6" fill="#4FAFB4"/>'});
  return o+'</svg>';
}

function bieuDoNhiet(ns){
  var W=320,H=140,mL=30,mR=10,mT=12,mB=22;
  var xs=ns.map(function(e){return tmin(e.time)}), ys=ns.map(function(e){return e.nd});
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs); if(x1===x0)x1=x0+60;
  var y0=Math.min(36.5,Math.min.apply(null,ys))-.3, y1=Math.max(38.5,Math.max.apply(null,ys))+.3;
  function px(v){return mL+(v-x0)/(x1-x0)*(W-mL-mR)}
  function py(v){return H-mB-(v-y0)/(y1-y0)*(H-mT-mB)}
  var o='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">';
  o+='<rect x="'+mL+'" y="'+mT+'" width="'+(W-mL-mR)+'" height="'+(py(37.5)-mT).toFixed(1)+'" fill="#FDEDEA"/>';
  o+='<line x1="'+mL+'" y1="'+py(37.5).toFixed(1)+'" x2="'+(W-mR)+'" y2="'+py(37.5).toFixed(1)+'" stroke="#F4B9AF" stroke-width="1.4" stroke-dasharray="4 4"/>';
  o+='<text x="'+(W-mR)+'" y="'+(py(37.5)-5).toFixed(1)+'" text-anchor="end" font-family="inherit" font-size="9" font-weight="600" fill="#E0705C">ngưỡng sốt 37,5</text>';
  for(var v=Math.ceil(y0*2)/2;v<=y1;v+=.5){
    o+='<line x1="'+mL+'" y1="'+py(v).toFixed(1)+'" x2="'+(W-mR)+'" y2="'+py(v).toFixed(1)+'" stroke="#F0E4D4" stroke-opacity=".7"/>';
    o+='<text x="'+(mL-6)+'" y="'+py(v).toFixed(1)+'" text-anchor="end" dominant-baseline="middle" font-family="inherit" font-size="9" font-weight="600" fill="#B3A196">'+String(v).replace('.',',')+'</text>'}
  var d=ns.slice().sort(function(a,b){return tmin(a.time)-tmin(b.time)});
  o+='<path d="'+d.map(function(e,i){return (i?'L':'M')+' '+px(tmin(e.time)).toFixed(1)+' '+py(e.nd).toFixed(1)}).join(' ')+'" fill="none" stroke="#E0705C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  d.forEach(function(e){var x=px(tmin(e.time)),y=py(e.nd);
    o+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5" fill="#fff" stroke="'+(e.nd>=37.5?'#E0705C':'#84B44F')+'" stroke-width="1.8"/>';
    o+='<text x="'+x.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-family="inherit" font-size="9" font-weight="600" fill="#B3A196">'+e.time+'</text>'});
  return o+'</svg>';
}

      '<p class="note" style="margin-bottom:14px">Một chén ăn dặm thường khoảng 150–200 ml. Ghi bằng chén cho nhanh, sau này nhìn lại vẫn so sánh được.</p></div>'+
      '<label class="lb">Bé ăn được bao nhiêu so với bữa</label>'+chips('luong',kvArr(LG),F.luong,mau)+
      '<label class="lb">Phản ứng của bé</label>'+chips('pu',kvArr(PU),F.pu,mau)+
      '<p id="wDiUng" class="warn'+(F.pu==='diung'?'':' hide')+'">Bữa này sẽ được đánh dấu đỏ để dễ tìm lại. Nếu bé nổi mẩn, nôn, khó thở hoặc tiêu chảy sau khi ăn, cho bé đi khám ngay.</p>'+
      '<label class="lb">Ghi chú</label><input data-f="ghi" value="'+esc(F.ghi)+'" placeholder="Ví dụ: món mới, bé ngậm lâu">'}
  if(k==='diaper'){mau='var(--ta)';td='GHI TÃ & PHÂN';
    F={_id:id||null,gio:g,loai:V('loai','phan'),tc:V('tc','mem'),mau:V('mau','vang'),ghi:V('ghi','')};
    b='<label class="lb">Giờ thay tã</label><input type="time" data-f="gio" value="'+g+'" style="margin-bottom:14px">'+
      '<label class="lb">Trong tã có gì</label>'+chips('loai',kvArr(TA),F.loai,mau)+
      '<div id="gPhan"'+(F.loai==='uot'?' class="hide"':'')+'><label class="lb">Tính chất phân</label>'+chips('tc',kvArr(TC),F.tc,mau)+
      '<label class="lb">Màu phân</label>'+chips('mau',kvArr(MP),F.mau,mau)+
      '<p id="wPhan" class="warn'+(CB.indexOf(F.mau)>=0?'':' hide')+'">Phân trắng bạc màu, phân đen hoặc có máu là dấu hiệu cần bác sĩ xem sớm. Ghi lại giờ và chụp ảnh tã để đưa bác sĩ xem.</p>'+
      '<p id="wLong" class="note'+(F.tc==='long'?'':' hide')+'" style="margin-bottom:12px">Nếu bé đi lỏng nhiều lần, ít tã ướt, môi khô hoặc lừ đừ, cho bé đi khám vì bé rất dễ mất nước.</p></div>'+
      '<label class="lb">Ghi chú thêm</label><input data-f="ghi" value="'+esc(F.ghi)+'" placeholder="Ví dụ: bé rặn nhiều, hăm nhẹ">'}
  if(k==='med'){mau='var(--thuoc)';td='GHI THUỐC ĐÃ UỐNG';
    F={_id:id||null,gio:g,ten:V('ten',''),lieu:V('lieu',''),dv:V('dv','ml'),ly:V('ly',''),ghi:V('ghi','')};
    b='<label class="lb">Giờ uống</label><input type="time" data-f="gio" value="'+g+'" style="margin-bottom:14px">'+
      '<label class="lb">Tên thuốc</label><input data-f="ten" id="fTen" value="'+esc(F.ten)+'" placeholder="Ví dụ: Vitamin D3" style="margin-bottom:10px">'+
      '<div class="chips">'+TG.map(function(m){return '<button class="chip" data-act="setten" data-v="'+m+'">'+m+'</button>'}).join('')+'</div>'+
      '<p id="tLan" class="tip hide"></p>'+
      '<label class="lb">Liều đã cho uống</label>'+
      '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px"><input data-f="lieu" value="'+esc(F.lieu)+'" inputmode="decimal" placeholder="2,5" style="width:88px">'+
      chips('dv',[['ml','ml'],['giọt','giọt'],['gói','gói'],['viên','viên']],F.dv,mau)+'</div>'+
      '<label class="lb">Lý do uống</label><input data-f="ly" value="'+esc(F.ly)+'" placeholder="Ví dụ: sốt 38,5 độ · bổ sung hằng ngày">'+
      '<label class="lb" style="margin-top:14px">Ghi chú</label><input data-f="ghi" value="'+esc(F.ghi)+'" placeholder="Ví dụ: uống xong bé nôn một ít">'+
      '<p class="note" style="margin-top:12px">Đây là sổ ghi lại những gì bé đã uống. Liều lượng và khoảng cách giữa các lần uống làm theo chỉ định của bác sĩ hoặc hướng dẫn trên hộp thuốc.</p>'}
  if(k==='can'){mau='var(--can)';td='GHI CÂN NẶNG';
    F={_id:id||null,ngay:V('ngay',dk(new Date())),kg:V('kg',''),cm:V('cm',''),ghi:V('ghi','')};
    b='<label class="lb">Ngày cân</label><input type="date" data-f="ngay" value="'+F.ngay+'" style="margin-bottom:14px">'+
      '<label class="lb">Cân nặng (kg)</label><input data-f="kg" value="'+esc(F.kg)+'" inputmode="decimal" placeholder="7,4" style="margin-bottom:14px">'+
      '<label class="lb">Chiều cao (cm) — không bắt buộc</label><input data-f="cm" value="'+esc(F.cm)+'" inputmode="decimal" placeholder="68" style="margin-bottom:14px">'+
      '<label class="lb">Ghi chú</label><input data-f="ghi" value="'+esc(F.ghi)+'" placeholder="Ví dụ: cân ở trạm y tế, mặc áo mỏng">'+
      '<p class="note" style="margin-top:12px">Cân bé vào cùng thời điểm trong ngày, tốt nhất là buổi sáng trước khi ăn, để các lần cân so sánh được với nhau.</p>'}
  if(k==='temp'){mau='var(--do)';td='GHI NHIỆT ĐỘ';
    F={_id:id||null,gio:g,nd:V('nd',''),vt:V('vt','nach'),ghi:V('ghi','')};
    b='<label class="lb">Giờ đo</label><input type="time" data-f="gio" value="'+g+'" style="margin-bottom:14px">'+
      '<label class="lb">Nhiệt độ</label>'+
      chips('nd',[['36.5','36,5'],['37','37'],['37.5','37,5'],['38','38'],['38.5','38,5'],['39','39'],['39.5','39,5'],['40','40']],F.nd,mau)+
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><input data-f="nd" value="'+esc(F.nd)+'" inputmode="decimal" placeholder="38,2" style="width:110px"><span>độ C</span></div>'+
      '<label class="lb">Đo ở đâu</label>'+chips('vt',[['nach','Nách'],['tran','Trán'],['tai','Tai'],['mieng','Miệng']],F.vt,mau)+
      '<p id="wSot" class="warn hide"></p>'+
      '<label class="lb">Ghi chú</label><input data-f="ghi" value="'+esc(F.ghi)+'" placeholder="Ví dụ: bé quấy, đã lau người, uống hạ sốt lúc 14h">'}
  if(k==='be'){mau='var(--muc2)';td='THÔNG TIN BÉ';F={};b=formBe()}

  document.getElementById('sheet').innerHTML='<div class="grip"></div>'+
    '<div class="sh"><span class="pill" style="background:'+mau+'">'+td+'</span>'+tim(12,mau,.55)+'</div>'+b+
    '<div class="acts"><button class="no" data-act="dong">Huỷ</button>'+
    '<button class="ok" style="background:'+mau+'" data-act="save" data-k="'+k+'">'+(k==='be'?'Xong':'Lưu')+'</button></div>'+
    (E?'<button data-act="xoatu" data-k="'+k+'" data-id="'+id+'" style="width:100%;margin-top:14px;color:var(--do);font-size:14px;padding:8px">Xoá mục này</button>':'');
  document.getElementById('modal').classList.add('on');
  document.getElementById('sheet').scrollTop=0;
  if(k!=='be')capNhatHien(k);
}

function dongBang(){document.getElementById('modal').classList.remove('on')}

function capNhatHien(k){
  if(!document.getElementById('sheet').querySelector('[data-act="save"]'))return;
  if(k==='milk'){
    document.getElementById('gBinh').classList.toggle('hide',F.loai!=='binh');
    document.getElementById('gMe').classList.toggle('hide',F.loai!=='me')}
  if(k==='solid'){document.getElementById('wDiUng').classList.toggle('hide',F.pu!=='diung');
    document.getElementById('gMl').classList.toggle('hide',F.adv==='chen');
    document.getElementById('gChen').classList.toggle('hide',F.adv!=='chen')}
  if(k==='diaper'){
    document.getElementById('gPhan').classList.toggle('hide',F.loai==='uot');
    document.getElementById('wPhan').classList.toggle('hide',CB.indexOf(F.mau)<0);
    document.getElementById('wLong').classList.toggle('hide',F.tc!=='long')}
  if(k==='temp'){
    var e2=document.getElementById('wSot'), d0=parseFloat(String(F.nd||'').replace(',','.')), tu2=tuoiTai(S.be.dob), m='';
    if(d0){
      if(d0<36)m='Nhiệt độ thấp hơn bình thường. Ủ ấm cho bé, đo lại sau 15 phút. Nếu bé lừ đừ, bú kém hoặc vẫn thấp, cho bé đi khám.';
      else if(tu2&&tu2.thang<3&&d0>=38)m='Bé dưới 3 tháng mà sốt từ 38 độ là phải đưa đi khám ngay, không tự cho uống hạ sốt ở nhà.';
      else if(d0>=39)m='Sốt cao. Cho bé đi khám. Trong lúc đó nới lỏng quần áo, lau người bằng nước ấm, cho bé uống sữa và nước nhiều hơn.';
      else if(d0>=38.5)m='Bé đang sốt. Thuốc hạ sốt và liều lượng làm theo chỉ định của bác sĩ. Đo lại sau mỗi 2–4 giờ và ghi vào đây.';
      else if(d0>=37.5)m='Sốt nhẹ. Theo dõi thêm, cho bé bú nhiều hơn, mặc thoáng và đo lại sau 1–2 giờ.';
    }
    if(m){e2.textContent=m;e2.classList.remove('hide')}else e2.classList.add('hide');
    e2.style.background=(d0&&d0>=37.5)||(d0&&d0<36)?'var(--doN)':'var(--laN)';
    e2.style.color=(d0&&d0>=37.5)||(d0&&d0<36)?'var(--do)':'var(--muc2)';
  }
  if(k==='med'){
    var el=document.getElementById('tLan'),ten=(F.ten||'').trim().toLowerCase();
    var same=(S.logs[ngay]||[]).filter(function(e){return e.kind==='med'&&(e.ten||'').toLowerCase()===ten&&tmin(e.time)<=bgio()})
      .sort(function(a,b){return tmin(a.time)-tmin(b.time)});
    if(ten&&same.length&&ngay===dk(new Date())){var c=same[same.length-1];
      el.textContent='Hôm nay bé đã uống '+F.ten.trim()+' lúc '+c.time+', cách đây '+khoang(bgio()-tmin(c.time))+'.';
      el.classList.remove('hide')}
    else el.classList.add('hide')}
}

function themLog(e){
  if(F._id){var a=S.logs[ngay]||[];
    for(var i=0;i<a.length;i++){if(String(a[i].id)===String(F._id)){e.id=a[i].id;a[i]=e;luu();return}}}
  e.id=Date.now()+Math.random();(S.logs[ngay]=S.logs[ngay]||[]).push(e);luu()}

function luuBang(k){
  if(k==='be'){S.be.ten=(F.ten!==undefined?F.ten:S.be.ten);S.be.dob=(F.dob!==undefined?F.dob:S.be.dob);
    if(F.gt)S.be.gt=F.gt;luu();dongBang();render();return}
  var gc=(F.ghi||'').trim();
  if(k==='milk'){if(F.loai==='binh')themLog({kind:'milk',time:F.gio,ml:parseInt(F.ml,10)||0,nguon:F.nguon,ghi:gc});
    else themLog({kind:'milk',time:F.gio,phut:parseInt(F.phut,10)||0,nguon:'Bú mẹ trực tiếp',ghi:gc})}
  if(k==='solid')themLog({kind:'solid',time:F.gio,mon:(F.mon||'').trim()||'Bữa ăn dặm',
    aml:parseFloat(String(F.aml||'').replace(',','.'))||0,adv:F.adv||'ml',luong:F.luong,pu:F.pu,ghi:gc,canhbao:F.pu==='diung'});
  if(k==='temp'){var nd=parseFloat(String(F.nd||'').replace(',','.'));
    if(!nd||nd<30||nd>45){alert('Nhập nhiệt độ của bé nhé.');return}
    themLog({kind:'temp',time:F.gio,nd:nd,vt:F.vt,ghi:gc,canhbao:nd>=38.5||nd<36})}
  if(k==='diaper'){var cp=F.loai!=='uot';
    themLog({kind:'diaper',time:F.gio,loai:F.loai,tc:cp?F.tc:null,mau:cp?F.mau:null,ghi:(F.ghi||'').trim(),canhbao:cp&&CB.indexOf(F.mau)>=0})}
  if(k==='med'){if(!(F.ten||'').trim()){alert('Nhập tên thuốc trước nhé.');return}
    themLog({kind:'med',time:F.gio,ten:F.ten.trim(),lieu:(F.lieu||'').trim(),dv:F.dv,ly:(F.ly||'').trim(),ghi:gc})}
  if(k==='can'){var kg=parseFloat(String(F.kg||'').replace(',','.'));
    if(!kg||kg<=0){alert('Nhập cân nặng của bé nhé.');return}
    var cm=parseFloat(String(F.cm||'').replace(',','.'));
    S.cans=S.cans.filter(function(x){return x.ngay!==F.ngay&&String(x.id)!==String(F._id)});
    S.cans.push({id:F._id||Date.now(),ngay:F.ngay,kg:kg,cm:(cm>0?cm:null),ghi:gc});luu()}
  dongBang();render();
}

/* ============ sao lưu ============ */
function saoLuu(){
  var b=new Blob([JSON.stringify(S)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='nhat-ky-be-'+dk(new Date())+'.json';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}
function khoiPhuc(){
  var i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=function(){var f=i.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var d=JSON.parse(r.result);
      if(!confirm('Thay toàn bộ dữ liệu hiện tại bằng file sao lưu này?'))return;
      S.be=d.be||S.be;S.logs=d.logs||{};S.cans=d.cans||[];S.tt=d.tt||{};S.tp=d.tp||{};luu();render();
      alert('Đã khôi phục xong.')}catch(e){alert('File không đọc được.')}};
    r.readAsText(f)};
  i.click();
}

/* ============ sự kiện ============ */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act],[data-chip]');if(!b)return;
  if(b.dataset.chip!==undefined){
    var g=b.parentNode, name=b.dataset.chip, mau=b.dataset.mau;
    [].forEach.call(g.querySelectorAll('.chip'),function(c){c.classList.remove('on');c.style.background='';c.style.borderColor=''});
    b.classList.add('on');b.style.background=mau;b.style.borderColor=mau;
    var v=b.dataset.val;
    if(name==='gt'){F.gt=v; if(!document.getElementById('modal').classList.contains('on')){S.be.gt=v;luu()}}
    else F[name]=v;
    var sv=document.querySelector('[data-act="save"]');
    if(sv)capNhatHien(sv.dataset.k);
    var inp=g.parentNode.querySelector('input[data-f="'+name+'"]');
    if(inp)inp.value=v;
    return;
  }
  var a=b.dataset.act;
  if(a==='prev'){ngay=addD(ngay,-1);render()}
  if(a==='next'){if(ngay!==dk(new Date())){ngay=addD(ngay,1);render()}}
  if(a==='goday'){ngay=b.dataset.d;render()}
  if(a==='open')sheet(b.dataset.k);
  if(a==='sua')sheet(b.dataset.k||null,b.dataset.id);
  if(a==='xoatu'){var i4=b.dataset.id;
    if(b.dataset.k==='can')S.cans=S.cans.filter(function(c){return String(c.id)!==i4});
    else S.logs[ngay]=(S.logs[ngay]||[]).filter(function(e){return String(e.id)!==i4});
    luu();dongBang();render()}
  if(a==='openBe')sheet('be');
  if(a==='dong')dongBang();
  if(a==='save')luuBang(b.dataset.k);
  if(a==='luuBe'){luu();render()}
  if(a==='xoa'){var id=b.dataset.id;
    S.logs[ngay]=(S.logs[ngay]||[]).filter(function(e){return String(e.id)!==id});luu();render()}
  if(a==='xoacan'){var i2=b.dataset.id;S.cans=S.cans.filter(function(c){return String(c.id)!==i2});luu();render()}
  if(a==='tick'){var k2=b.dataset.k,t=S.tt[ngay]||{cb:{},note:''};
    t.cb[k2]=!t.cb[k2];S.tt[ngay]=t;luu();
    b.classList.toggle('on',!!t.cb[k2]);b.querySelector('.box').textContent=t.cb[k2]?'✓':''}
  if(a==='addmon'){var f=document.getElementById('fMon');
    f.value=f.value?(f.value+', '+b.dataset.v.toLowerCase()):b.dataset.v;F.mon=f.value}
  if(a==='setten'){var ft=document.getElementById('fTen');ft.value=b.dataset.v;F.ten=b.dataset.v;capNhatHien('med')}
  if(a==='tp'){var g2=b.dataset.g,v2=b.dataset.v,t3=S.tp[ngay]||{};
    t3[g2]=t3[g2]||{c:[],g:''};
    var i3=t3[g2].c.indexOf(v2);
    if(i3>=0)t3[g2].c.splice(i3,1);else t3[g2].c.push(v2);
    S.tp[ngay]=t3;luu();
    var on2=i3<0;b.classList.toggle('on',on2);
    b.style.background=on2?b.dataset.mau:'';b.style.borderColor=on2?b.dataset.mau:''}
  if(a==='saoluu')saoLuu();
  if(a==='khoiphuc')khoiPhuc();
});
document.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.dataset.f!==undefined){
    F[el.dataset.f]=el.value;
    var sv=document.querySelector('[data-act="save"]');
    if(sv&&document.getElementById('modal').classList.contains('on'))capNhatHien(sv.dataset.k);
    if(!document.getElementById('modal').classList.contains('on')){
      if(el.dataset.f==='ten')S.be.ten=el.value;
      if(el.dataset.f==='dob')S.be.dob=el.value;}
  }
  if(el.dataset.act==='tpnote'){var g3=el.dataset.g,t4=S.tp[ngay]||{};
    t4[g3]=t4[g3]||{c:[],g:''};t4[g3].g=el.value;S.tp[ngay]=t4;
    clearTimeout(window._tp);window._tp=setTimeout(luu,400)}
  if(el.dataset.act==='note'){var t=S.tt[ngay]||{cb:{},note:''};t.note=el.value;S.tt[ngay]=t;
    clearTimeout(window._nt);window._nt=setTimeout(luu,400)}
});
document.getElementById('modal').addEventListener('click',function(ev){if(ev.target.id==='modal')dongBang()});

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}

taiDL();render();
/* đổi sang ngày mới nếu app mở qua nửa đêm */
setInterval(function(){var t=dk(new Date());
  if(ngay!==t&&!document.getElementById('modal').classList.contains('on')&&document.visibilityState==='visible'){
    if(ngay===addD(t,-1)){ngay=t;render()}}},60000);
</script>
</body>
